name: Pi Web Desktop Windows
on:
  workflow_dispatch:
  push:
    branches: [feat/piweb-portless-desktop, feat/piweb-desktop-opencode]
permissions:
  contents: read
jobs:
  stage:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - name: Verify desktop transport and existing HTTP mode
        shell: pwsh
        run: |
          node --test --test-timeout=15000 tests/desktop-local-http.test.mjs tests/desktop-goal-transport.test.mjs tests/desktop-links.test.mjs tests/piweb-preview-links.mjs tests/piweb-ui-proxy.mjs tests/desktop-account-maintenance.test.mjs tests/account-auto-reset-contract.mjs tests/account-pool-contract.mjs tests/account-usage-contract.mjs tests/piweb-account-usage-contract.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Transport contracts failed' }
          foreach ($script in Get-ChildItem src/desktop/*.mjs) {
            node --check $script.FullName
            if ($LASTEXITCODE -ne 0) { throw 'Desktop source failed syntax validation' }
          }
      - name: Verify isolated goal board in Electron
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://github.com/electron/electron/releases/download/v45.4.1/electron-v45.4.1-win32-x64.zip' -OutFile electron.zip
          if ((Get-FileHash electron.zip -Algorithm SHA256).Hash.ToLower() -ne '2ba6223afa9121f42831fefe92c434334907540165294fc56697449d12e7cfe9') { throw 'Electron archive hash mismatch' }
          Expand-Archive electron.zip -DestinationPath electron-test
          $env:PI_GOAL_ELECTRON_LOG = Join-Path $env:RUNNER_TEMP 'pi-goal-electron.log'
          $test = Start-Process -FilePath (Join-Path $pwd 'electron-test/electron.exe') -ArgumentList 'tests/desktop-goal-electron' -WorkingDirectory $pwd -PassThru
          if (!$test.WaitForExit(90000)) { $test.Kill(); throw 'Electron board integration timed out' }
          if (Test-Path $env:PI_GOAL_ELECTRON_LOG) { Get-Content $env:PI_GOAL_ELECTRON_LOG }
          if ($test.ExitCode -ne 0) { throw "Electron board integration failed: $($test.ExitCode)" }
      - name: Verify the pinned OpenCode executable
        if: github.ref_name == 'feat/piweb-desktop-opencode'
        shell: pwsh
        run: |
          curl.exe -fSL --retry 2 -o opencode.zip 'https://github.com/anomalyco/opencode/releases/download/v1.19.6/opencode-windows-x64.zip'
          if ($LASTEXITCODE -ne 0 -or (Get-FileHash opencode.zip -Algorithm SHA256).Hash.ToLower() -ne 'fa31c9ec0bac7611ab12699ef8e2fc4c173fb95ac977b09b189b255b8f559bcc') { throw 'OpenCode archive hash mismatch' }
          Expand-Archive opencode.zip -DestinationPath opencode-cli
          $env:PI_WEB_OPENCODE_BIN = (Resolve-Path opencode-cli/opencode.exe).Path
          node --experimental-strip-types --test tests/piweb-opencode-agent.mjs
          if ($LASTEXITCODE -ne 0) { throw 'OpenCode native tooling contract failed' }
      - uses: actions/checkout@v4
        if: github.ref_name == 'feat/piweb-desktop-opencode'
        with:
          repository: agegr/pi-web
          ref: 0876cf4eecdc345da3a58f4418d5af96e45b33e7
          path: upstream
          persist-credentials: false
      - name: Integrate and build the desktop Pi Web renderer
        if: github.ref_name == 'feat/piweb-desktop-opencode'
        shell: pwsh
        run: |
          node --experimental-strip-types --test tests/piweb-cline-agent.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Agent switching contract failed' }
          node tools/patch-piweb-source.mjs --source upstream
          if ($LASTEXITCODE -ne 0) { throw 'Source integration failed' }
          Push-Location upstream
          npm install --include=dev --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Pi Web dependency install failed' }
          node node_modules/typescript/bin/tsc --noEmit
          if ($LASTEXITCODE -ne 0) { throw 'Pi Web typecheck failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Pi Web renderer build failed' }
          $packed = npm pack --json --ignore-scripts --pack-destination .. | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Pi Web renderer pack failed' }
          Pop-Location
          Move-Item $packed[0].filename pi-web-upstream.tgz
          (Get-FileHash pi-web-upstream.tgz -Algorithm SHA256).Hash | Set-Content pi-web-upstream.tgz.sha256
      - name: Package desktop runtime integration
        shell: pwsh
        run: |
          $stage = New-Item -Type Directory desktop-dist
          Copy-Item -Recurse src,assets $stage.FullName
          New-Item -Type Directory (Join-Path $stage.FullName 'tools') | Out-Null
          Copy-Item tools/backup.mjs (Join-Path $stage.FullName 'tools')
          New-Item -Type Directory (Join-Path $stage.FullName 'tests') | Out-Null
          Copy-Item tests/desktop-backend-smoke.mjs (Join-Path $stage.FullName 'tests')
          Copy-Item LICENSE $stage.FullName
          $receipt = [ordered]@{commit=$env:GITHUB_SHA;runId=$env:GITHUB_RUN_ID;electron='45.4.1';electronSha256='2ba6223afa9121f42831fefe92c434334907540165294fc56697449d12e7cfe9'}
          $receipt | ConvertTo-Json | Set-Content desktop-dist/build.json -Encoding utf8
          Compress-Archive -Path desktop-dist/* -DestinationPath pi-web-desktop-win-x64.zip
          (Get-FileHash pi-web-desktop-win-x64.zip -Algorithm SHA256).Hash | Set-Content pi-web-desktop-win-x64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: pi-web-desktop-win-x64
          path: |
            pi-web-desktop-win-x64.zip
            pi-web-desktop-win-x64.zip.sha256
            pi-web-upstream.tgz
            pi-web-upstream.tgz.sha256
