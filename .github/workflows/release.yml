name: Build portable exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version label for manual builds"
        required: false
        default: "dev"

permissions:
  contents: write

env:
  NODE_VERSION: "22.19.0"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"

      - name: Verify portable contracts
        shell: pwsh
        run: |
          node tests/launcher-portable-node-contract.mjs
          node tests/windows-process-env.mjs
          node tests/windows-launcher-contract.mjs
          node tests/lop-chain-contract.mjs
          node --test tests/goal-redirector-contract.mjs
          node --test tests/run-supervisor.mjs
          node --test tests/account-pool-contract.mjs
          node --test tests/account-usage-contract.mjs
          node --test tests/piweb-session-archive.mjs
          node --test tests/piweb-archive-confirmation-contract.mjs
          node --test tests/piweb-worktree-visibility-contract.mjs
          node --test tests/piweb-account-usage-contract.mjs
          node tests/rules-snapshot-contract.mjs
          node tests/deploy-rules-remote-contract.mjs
          node --test tests/pi-history-contract.mjs
          node --test tests/deterministic-fast-path.mjs
          node --test tests/bridge-response-replay.mjs
          node --test tests/codex-overload-retry.mjs
          node --test tests/tray-contract.mjs
          node --test tests/hard-restart-contract.mjs
          node --test tests/patch-piweb-fold-contract.mjs
          node --test tests/patch-piweb-draft-persist-contract.mjs
          node --test tests/patch-piweb-interactions-contract.mjs
          node --test tests/patch-piweb-show-thinking-contract.mjs
          node --test tests/patch-piweb-hide-hidden-extension-messages-contract.mjs
          node --test tests/patch-piweb-conversation-nodes-contract.mjs
          node --test tests/pi-trust-and-proxy-contract.mjs
          node tools/pi-five-chain-benchmark.mjs --dry-run

      - name: Stage portable node runtime
        shell: pwsh
        run: |
          $ver = "v$env:NODE_VERSION"
          $url = "https://nodejs.org/dist/$ver/node-$ver-win-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile node.zip
          Expand-Archive node.zip -DestinationPath nodedist
          New-Item -ItemType Directory -Force -Path stage/runtime | Out-Null
          Copy-Item "nodedist/node-$ver-win-x64/node.exe" stage/runtime/node.exe
          if (-not (Test-Path stage/runtime/node.exe)) { throw "portable node missing" }

      - name: Build native no-console launcher
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere missing" }
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ([string]::IsNullOrWhiteSpace($vs)) { throw "MSVC x64 toolchain missing" }
          $devShell = Join-Path $vs "Common7\Tools\Launch-VsDevShell.ps1"
          & $devShell -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          if (-not (Get-Command cl.exe -ErrorAction SilentlyContinue)) { throw "cl.exe missing after VsDevShell" }
          & rc.exe /nologo /fo stage\pi-portable-launcher.res packaging\windows-launcher.rc
          if ($LASTEXITCODE -ne 0) { throw "resource compilation failed: $LASTEXITCODE" }
          & cl.exe /nologo /std:c++17 /O1 /MT /W4 /WX /DUNICODE /D_UNICODE /GS /guard:cf packaging\windows-launcher.cpp stage\pi-portable-launcher.res /Fe:stage\pi-portable-launcher.exe /link /SUBSYSTEM:WINDOWS /DYNAMICBASE /NXCOMPAT /OPT:REF /OPT:ICF
          if ($LASTEXITCODE -ne 0) { throw "native launcher compilation failed: $LASTEXITCODE" }
          Remove-Item stage\pi-portable-launcher.res
          $launcher = Get-Item stage\pi-portable-launcher.exe
          if ($launcher.Length -ge 1MB) { throw "native launcher must stay below 1 MiB, actual=$($launcher.Length)" }
          $bytes = [IO.File]::ReadAllBytes($launcher.FullName)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          $subsystem = [BitConverter]::ToUInt16($bytes, $peOffset + 24 + 68)
          if ($subsystem -ne 2) { throw "native launcher is not Windows GUI subsystem: $subsystem" }
          Write-Host "native GUI launcher $($launcher.Length) bytes; subsystem=$subsystem"
          Copy-Item -LiteralPath $launcher.FullName -Destination windows-silent-exec-host.exe
          (Get-FileHash windows-silent-exec-host.exe -Algorithm SHA256).Hash | Set-Content windows-silent-exec-host.exe.sha256

      - name: Verify native launcher supervision
        shell: pwsh
        run: |
          & tests/native-launcher-smoke.ps1 -Launcher (Resolve-Path stage/pi-portable-launcher.exe) -Node (Resolve-Path stage/runtime/node.exe)

      - name: Verify standalone silent exec host
        shell: pwsh
        run: |
          & tests/silent-exec-host-smoke.ps1 -Launcher (Resolve-Path windows-silent-exec-host.exe) -Node (Resolve-Path stage/runtime/node.exe)

      - name: Stage app layer (pi-web + pi)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage/app | Out-Null
          Push-Location stage/app
          npm init -y | Out-Null
          npm install --omit=dev --no-audit --no-fund "@agegr/pi-web@latest" "@earendil-works/pi-coding-agent@latest"
          Pop-Location
          if (-not (Test-Path stage/app/node_modules/@agegr/pi-web/package.json)) { throw "pi-web not installed" }

      - name: Verify hidden Git Bash native children
        shell: pwsh
        run: |
          $bash = @(
            "$env:ProgramFiles\Git\bin\bash.exe",
            "${env:ProgramFiles(x86)}\Git\bin\bash.exe"
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $bash) { throw "Git for Windows bash.exe not found" }
          $python = (Get-Command python.exe -ErrorAction Stop).Source
          & tests/msys-pcon-smoke.ps1 -Bash $bash -Python $python

      - name: Stage custom layer (bridge + chain + launcher)
        shell: pwsh
        run: |
          Copy-Item -Recurse src stage/src
          Copy-Item -Recurse assets stage/assets
          New-Item -ItemType Directory -Force -Path stage/tools | Out-Null
          Copy-Item tools/remote-verify.mjs stage/tools/remote-verify.mjs
          Copy-Item tools/deploy-rules-remote.mjs stage/tools/deploy-rules-remote.mjs
          Copy-Item tools/patch-piweb-fold.mjs stage/tools/patch-piweb-fold.mjs
          Copy-Item tools/patch-piweb-draft-persist.mjs stage/tools/patch-piweb-draft-persist.mjs
          Copy-Item tools/patch-piweb-interactions.mjs stage/tools/patch-piweb-interactions.mjs
          Copy-Item tools/patch-piweb-hide-recovered.mjs stage/tools/patch-piweb-hide-recovered.mjs
          Copy-Item tools/patch-piweb-drop-auto-thinking.mjs stage/tools/patch-piweb-drop-auto-thinking.mjs
          Copy-Item tools/patch-piweb-show-thinking.mjs stage/tools/patch-piweb-show-thinking.mjs
          Copy-Item tools/patch-piweb-hide-hidden-extension-messages.mjs stage/tools/patch-piweb-hide-hidden-extension-messages.mjs
          Copy-Item tools/patch-piweb-conversation-nodes.mjs stage/tools/patch-piweb-conversation-nodes.mjs
          Copy-Item LICENSE stage/LICENSE
          Copy-Item README.md stage/README.md
          if (-not (Test-Path stage/pi-portable-launcher.exe)) { throw "native launcher missing" }
          if (-not (Test-Path stage/src/launcher.mjs)) { throw "launcher missing" }
          if (-not (Test-Path stage/src/run-supervisor.mjs)) { throw "run supervisor missing" }
          if (-not (Test-Path stage/src/piweb-archive-ui.js)) { throw "pi-web archive UI missing" }
          if (-not (Test-Path stage/src/bridge/account-usage.mjs)) { throw "account usage monitor missing" }
          if (-not (Test-Path stage/tools/remote-verify.mjs)) { throw "remote verifier missing" }
          if (-not (Test-Path stage/tools/deploy-rules-remote.mjs)) { throw "remote rules deployer missing" }
          if (-not (Test-Path stage/tools/patch-piweb-interactions.mjs)) { throw "pi-web interactions patch missing" }
          if (-not (Test-Path stage/tools/patch-piweb-hide-recovered.mjs)) { throw "pi-web hide-recovered patch missing" }
          if (-not (Test-Path stage/tools/patch-piweb-drop-auto-thinking.mjs)) { throw "pi-web drop-auto-thinking patch missing" }
          if (-not (Test-Path stage/tools/patch-piweb-show-thinking.mjs)) { throw "pi-web show-thinking patch missing" }
          if (-not (Test-Path stage/tools/patch-piweb-hide-hidden-extension-messages.mjs)) { throw "pi-web hidden-extension patch missing" }
          if (-not (Test-Path stage/tools/patch-piweb-conversation-nodes.mjs)) { throw "pi-web conversation-nodes patch missing" }

      - name: Assert no embedded assets
        shell: pwsh
        run: |
          # 2026-08-29 方案改定:发行物只出脱敏 base.exe,敏感资产一律走 SSH 私道进数据根,
          # 不再嵌加密资产段。stage 里若出现 assets.enc 直接失败,防旧路径复活。
          if (Test-Path stage/assets.enc) { throw "assets.enc must not be embedded; ship base exe only" }
          if (Test-Path stage/pi-portable.cmd) { throw "legacy cmd entry must not be shipped" }
          if (Test-Path stage/src/launch-silent.vbs) { throw "deprecated VBScript entry must not be shipped" }
          Write-Host "base exe (native GUI entry; no cmd/VBScript; no embedded credentials)"

      - name: Build single-file exe (7z SFX)
        shell: pwsh
        run: |
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "${{ inputs.tag }}" }
          if ([string]::IsNullOrEmpty($tag)) { $tag = "dev" }
          $out = "pi-portable-$tag.exe"
          7z a -t7z -mx=5 payload.7z ./stage/* | Out-Null
          if (-not (Test-Path payload.7z)) { throw "payload not built" }
          $sfx = "$env:ProgramFiles\7-Zip\7z.sfx"
          if (-not (Test-Path $sfx)) { $sfx = "$env:ProgramFiles\7-Zip\7zCon.sfx" }
          if (-not (Test-Path $sfx)) { throw "7z SFX module not found" }
          cmd /c copy /b "$sfx" + packaging\sfx-config.txt + payload.7z "$out"
          if (-not (Test-Path $out)) { throw "exe not produced" }
          $size = [math]::Round((Get-Item $out).Length / 1MB, 1)
          Write-Host "built $out ($size MB)"
          (Get-FileHash $out -Algorithm SHA256).Hash | Set-Content "$out.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pi-portable-exe
          path: |
            pi-portable-*.exe
            pi-portable-*.exe.sha256
            windows-silent-exec-host.exe
            windows-silent-exec-host.exe.sha256

      - name: Publish release (tag only)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pi-portable-*.exe
            pi-portable-*.exe.sha256
            windows-silent-exec-host.exe
            windows-silent-exec-host.exe.sha256
          generate_release_notes: true
