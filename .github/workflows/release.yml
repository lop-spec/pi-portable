name: Build portable exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version label for manual builds"
        required: false
        default: "dev"

permissions:
  contents: write

env:
  NODE_VERSION: "22.19.0"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"

      - name: Verify portable contracts
        shell: pwsh
        run: |
          node tests/launcher-portable-node-contract.mjs
          node tests/lop-chain-contract.mjs

      - name: Stage portable node runtime
        shell: pwsh
        run: |
          $ver = "v$env:NODE_VERSION"
          $url = "https://nodejs.org/dist/$ver/node-$ver-win-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile node.zip
          Expand-Archive node.zip -DestinationPath nodedist
          New-Item -ItemType Directory -Force -Path stage/runtime | Out-Null
          Copy-Item "nodedist/node-$ver-win-x64/node.exe" stage/runtime/node.exe
          if (-not (Test-Path stage/runtime/node.exe)) { throw "portable node missing" }

      - name: Stage app layer (pi-web + pi)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage/app | Out-Null
          Push-Location stage/app
          npm init -y | Out-Null
          npm install --omit=dev --no-audit --no-fund "@agegr/pi-web@latest" "@earendil-works/pi-coding-agent@latest"
          Pop-Location
          if (-not (Test-Path stage/app/node_modules/@agegr/pi-web/package.json)) { throw "pi-web not installed" }

      - name: Stage custom layer (bridge + chain + launcher)
        shell: pwsh
        run: |
          Copy-Item -Recurse src stage/src
          Copy-Item LICENSE stage/LICENSE
          Copy-Item README.md stage/README.md
          Copy-Item packaging/pi-portable.cmd stage/pi-portable.cmd
          if (-not (Test-Path stage/src/launcher.mjs)) { throw "launcher missing" }

      - name: Assert no embedded assets
        shell: pwsh
        run: |
          # 2026-08-29 方案改定:发行物只出脱敏 base.exe,敏感资产一律走 SSH 私道进数据根,
          # 不再嵌加密资产段。stage 里若出现 assets.enc 直接失败,防旧路径复活。
          if (Test-Path stage/assets.enc) { throw "assets.enc must not be embedded; ship base exe only" }
          Write-Host "base exe (no embedded assets; credentials delivered out-of-band)"

      - name: Build single-file exe (7z SFX)
        shell: pwsh
        run: |
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "${{ inputs.tag }}" }
          if ([string]::IsNullOrEmpty($tag)) { $tag = "dev" }
          $out = "pi-portable-$tag.exe"
          7z a -t7z -mx=5 payload.7z ./stage/* | Out-Null
          if (-not (Test-Path payload.7z)) { throw "payload not built" }
          $sfx = "$env:ProgramFiles\7-Zip\7z.sfx"
          if (-not (Test-Path $sfx)) { $sfx = "$env:ProgramFiles\7-Zip\7zCon.sfx" }
          if (-not (Test-Path $sfx)) { throw "7z SFX module not found" }
          cmd /c copy /b "$sfx" + packaging\sfx-config.txt + payload.7z "$out"
          if (-not (Test-Path $out)) { throw "exe not produced" }
          $size = [math]::Round((Get-Item $out).Length / 1MB, 1)
          Write-Host "built $out ($size MB)"
          (Get-FileHash $out -Algorithm SHA256).Hash | Set-Content "$out.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pi-portable-exe
          path: |
            pi-portable-*.exe
            pi-portable-*.exe.sha256

      - name: Publish release (tag only)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pi-portable-*.exe
            pi-portable-*.exe.sha256
          generate_release_notes: true
